baseURL: "https://juliandominic.github.io/"
title: Julian
copyright: "© Julian Dominic Liaw"
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: true # dates come from git commits (powers "last updated")

# Only blog posts get tags; no separate tag/category pages are generated.
disableKinds: [taxonomy, term, RSS]

menus:
  main:
    - name: home
      pageRef: /
      weight: 1
    - name: blog
      pageRef: /blog
      weight: 2

params:
  description: "Julian Dominic Liaw — Computer Science @ SMU. Systems, SRE, and homelab tinkering."
  # Shown as the contact row under the bio on the home page (in this order).
  links:
    - name: email
      url: "mailto:juliandominicliaw@outlook.com"
    - name: github
      url: "https://github.com/JulianDominic"
    - name: linkedin
      url: "https://www.linkedin.com/in/julian-dominic-liaw/"

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML inside markdown
  highlight:
    noClasses: false # colours come from assets/css/main.css (light + dark)
